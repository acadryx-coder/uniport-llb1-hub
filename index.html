<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5f0" />
  <title>LLB 1 Hub · UNIPORT</title>
  
  <!-- Favicon (Replace with your generated logo later) -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />

  <!-- Default OG Meta (Fallback) -->
  <meta property="og:title" content="LLB 1 Hub · UNIPORT" />
  <meta property="og:description" content="The official academic hub for LLB 1, Faculty of Law, University of Port Harcourt." />
  <meta property="og:image" content="https://uniport-llb1-hub.vercel.app/og-default.png" />
  <meta property="og:url" content="https://uniport-llb1-hub.vercel.app" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <script>
    (function () {
      try {
        var t = localStorage.getItem('llb1.theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
